<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>layx line comparison</title>
<style>
  html, body { margin: 0; padding: 0; }
  @font-face { font-family: book; src: url('/fonts/book.font') format('truetype'); }
  #book {
    position: absolute; left: 40px; top: 40px;
    margin: 0; padding: 0; box-sizing: content-box;
    font-family: book, serif;
    text-align: justify;
    hyphens: manual;
    word-break: normal;
  }
  #book p, #cols p { margin: 0 0 var(--gap) 0; text-indent: 2em; }
  #cols {
    position: absolute; left: -20000px; top: 0;
    margin: 0; padding: 0; box-sizing: content-box;
    column-gap: 0; column-fill: auto; overflow: hidden;
  }
</style>
</head>
<body>
<div id="book"></div>
<script src="lines.js"></script>
</body>
</html>
