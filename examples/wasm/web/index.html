<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layx · wasm + canvas</title>
<style>
  :root {
    --bg: #0c0e12;
    --panel: #11141a;
    --line: #1f242d;
    --ink: #dde2ea;
    --dim: #8b95a4;
    --accent: #7aa2f7;
    --accent-soft: rgba(122, 162, 247, .14);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    background: radial-gradient(1200px 600px at 70% -10%, #171b24 0%, var(--bg) 60%);
    color: var(--ink);
    font: 13px/1.55 ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 13px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(12, 14, 18, .72);
    backdrop-filter: blur(8px);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b { font-size: 19px; letter-spacing: -.02em; }
  .brand span { color: var(--dim); font-size: 12px; }
  .pill {
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--accent-soft);
    color: var(--accent) !important;
    font-size: 11px !important;
    letter-spacing: .02em;
  }
  .stats { display: flex; gap: 26px; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
  .stat b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .09em; }

  main {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    grid-template-areas: "panel stage";
    min-height: 0;
  }

  aside {
    grid-area: panel;
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, var(--panel), #0d1015);
    padding: 18px 16px 30px;
    overflow: auto;
  }
  .group { padding: 0 4px 18px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .group:last-child { border-bottom: 0; }
  .group h2 {
    margin: 0 0 12px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .group > p { margin: 0 0 8px; color: var(--dim); font-size: 12px; }
  .group > p.hint { margin-top: 10px; line-height: 1.6; }

  label.control { display: block; margin-bottom: 14px; }
  label.control .row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  label.control output { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] {
    width: 100%;
    height: 18px;
    margin: 0;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: #262c37; }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: #262c37; }
  input[type=range]::-webkit-slider-thumb {
    appearance: none;
    width: 13px; height: 13px; margin-top: -5px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #0c0e12;
    box-shadow: 0 0 0 1px var(--accent);
  }
  input[type=range]::-moz-range-thumb {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #0c0e12;
  }

  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .switch input {
    appearance: none;
    width: 34px; height: 18px;
    margin: 0;
    border-radius: 999px;
    background: #262c37;
    position: relative;
    cursor: pointer;
    transition: background .15s;
  }
  .switch input::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #96a0ae;
    transition: transform .15s, background .15s;
  }
  .switch input:checked { background: var(--accent-soft); }
  .switch input:checked::after { transform: translateX(16px); background: var(--accent); }

  .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .themes button, .sections button {
    font: inherit;
    color: var(--dim);
    background: #151922;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 8px;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
    text-align: left;
  }
  .themes button:hover, .sections button:hover { border-color: #33405a; color: var(--ink); }
  .themes button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .themes button[data-theme="0"]::before,
  .themes button[data-theme="1"]::before,
  .themes button[data-theme="2"]::before {
    content: "";
    display: block;
    height: 18px;
    border-radius: 4px;
    margin-bottom: 6px;
    border: 1px solid rgba(0, 0, 0, .25);
  }
  .themes button[data-theme="0"]::before { background: #faf8f3; }
  .themes button[data-theme="1"]::before { background: #f3e7d3; }
  .themes button[data-theme="2"]::before { background: #14161a; }

  .sections { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .sections button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sections button .n { color: #5f6b7d; font-size: 11px; font-variant-numeric: tabular-nums; }
  .sections li.active button { border-color: #33405a; color: var(--ink); background: #171c26; }
  .sections li.active button .n { color: var(--accent); }

  .stage {
    grid-area: stage;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 22px;
    overflow: hidden;
  }
  .paper { position: relative; line-height: 0; }
  .paper::after {
    content: "";
    position: absolute;
    inset: auto 8% -14px;
    height: 40px;
    background: rgba(0, 0, 0, .5);
    filter: blur(22px);
    border-radius: 50%;
    z-index: -1;
  }
  canvas {
    display: block;
    border-radius: 5px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .06);
    touch-action: none;
    cursor: text;
  }
  #overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: none;
  }

  .nav {
    width: min(720px, 100%);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 4px;
  }
  .nav button {
    width: 34px; height: 30px;
    flex: none;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #151922;
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
  }
  .nav button:hover:not(:disabled) { border-color: #3a4763; background: #1a1f2a; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav input[type=range] { flex: 1; }
  .nav #pageLabel {
    min-width: 62px;
    text-align: right;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 9px 22px 11px;
    border-top: 1px solid var(--line);
    color: var(--dim);
    font-size: 12px;
  }
  footer #status { color: var(--ink); font-variant-numeric: tabular-nums; }
  footer #status.error { color: #f7768e; }
  footer #hint { color: #5f6b7d; }

  @media (max-width: 940px) {
    main {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "stage" "panel";
    }
    aside {
      border-right: 0;
      border-top: 1px solid var(--line);
      max-height: 44vh;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      align-content: start;
      gap: 0 22px;
    }
    .group { border-bottom: 0; margin-bottom: 0; }
    .stage { padding: 14px; }
    footer #hint { display: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <b>layx</b>
      <span class="pill">wasm + canvas</span>
      <span>Go 排版内核，浏览器里跑</span>
    </div>
    <div class="stats">
      <div class="stat"><b id="pages">–</b><span>pages</span></div>
      <div class="stat"><b id="layoutMs">–</b><span>layout ms</span></div>
      <div class="stat"><b id="renderMs">–</b><span>render ms</span></div>
    </div>
  </header>

  <main>
    <aside>
      <section class="group">
        <h2>排版</h2>
        <label class="control">
          <span class="row"><span>字号</span><output id="fontSizeVal">18px</output></span>
          <input id="fontSize" type="range" min="14" max="26" step="1" value="18">
        </label>
        <label class="control">
          <span class="row"><span>行高</span><output id="lineHeightVal">1.65</output></span>
          <input id="lineHeight" type="range" min="1.3" max="2.1" step="0.05" value="1.65">
        </label>
        <label class="control switch">
          <span>两端对齐</span>
          <input id="justify" type="checkbox" checked>
        </label>
      </section>

      <section class="group">
        <h2>主题</h2>
        <div class="themes">
          <button data-theme="0" class="active">Paper</button>
          <button data-theme="1">Sepia</button>
          <button data-theme="2">Night</button>
        </div>
      </section>

      <section class="group">
        <h2>章节</h2>
        <ul id="sections" class="sections"></ul>
      </section>

      <section class="group">
        <h2>字体</h2>
        <p id="fontInfo">加载中…</p>
        <p class="hint">shaping、断行、分页全部发生在 WASM 里；Canvas 只回放 DisplayList，字形轮廓直接取自字体文件。</p>
      </section>
    </aside>

    <section class="stage" id="stage">
      <div class="paper">
        <canvas id="page" width="640" height="900"></canvas>
        <canvas id="overlay" width="640" height="900"></canvas>
      </div>
      <div class="nav">
        <button id="btnPrev" title="上一页 (←)">←</button>
        <input id="pageSlider" type="range" min="0" max="0" value="0">
        <span id="pageLabel">0 / 0</span>
        <button id="btnNext" title="下一页 (→)">→</button>
      </div>
    </section>
  </main>

  <footer>
    <span id="status">加载 wasm…</span>
    <span id="hint">拖动选中 · 单击落光标 · 点击链接 · ← → 翻页</span>
  </footer>

  <script src="wasm_exec.js"></script>
  <script src="main.js"></script>
</body>
</html>
